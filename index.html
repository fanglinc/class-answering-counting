<title>课堂互动积分系统</title>

  text-align: center;

  position: relative;
  overflow: hidden;

  content: "";

  top: 0; left: 0; right: 0; height: 3px;

  font-size: 16px;

  border-radius: 8px;
  background: #fff;

/* 迷你 Supabase Mock：实现 .from().select().eq()/.in()/.order()/.limit()/.maybeSingle()/.insert()
   设计原则：每个链式方法返回同一个 builder 对象；builder.then 可被 await；insert 直接返回 {data,error} */
function createMockSupabase() {
  const self = {};

  self.from = function(table) {
    const db = getMockDB();
    const b = {
      _table: table,
      _selectStr: '',
      _filters: [],
      _order: null,
      _limitVal: null,

      select(cols) { this._selectStr = cols || ''; return this; },
      eq(col, val) { this._filters.push({ type: 'eq', col, val }); return this; },
      in(col, arr) { this._filters.push({ type: 'in', col, val: arr }); return this; },
      order(col, opts = {}) { this._order = { col, ...opts }; return this; },
      limit(n) { this._limitVal = n; return this; },

      maybeSingle() {
        return this._execute().then(rows => ({
          data: rows.length > 0 ? rows[0] : null,
          error: null
        }));
      },

      insert(payload) {
        const d = getMockDB();
        const list = d[table] || [];
        const nextId = (d._nextScoreId || Math.max(0, ...list.map(r => r.id || 0)) + 1);
        const record = { id: nextId, created_at: new Date().toISOString(), ...payload };
        list.push(record);
        d[table] = list;
        if (table === 'scores') d._nextScoreId = nextId + 1;
        saveMockDB(d);
        return Promise.resolve({ data: record, error: null });
      },

      _execute() {
        const d = getMockDB();
        let rows = JSON.parse(JSON.stringify(d[table] || []));

        // 联表：students + classes(name)
        if (table === 'students' && this._selectStr.includes('classes')) {
          rows = rows.map(s => {
            const cls = d.classes.find(c => c.id === s.class_id);
            return { ...s, classes: cls ? { name: cls.name } : null };
          });
        }

        for (const f of this._filters) {
          if (f.type === 'eq') rows = rows.filter(r => r[f.col] == f.val);
          else if (f.type === 'in') rows = rows.filter(r => f.val.includes(r[f.col]));
        }

        if (this._order) {
          const { col, ascending = true } = this._order;
          rows.sort((a, b) => {
            const va = a[col], vb = b[col];
            if (va < vb) return ascending ? -1 : 1;
            if (va > vb) return ascending ? 1 : -1;
            return 0;
          });
        }
        if (this._limitVal != null) rows = rows.slice(0, this._limitVal);
        return Promise.resolve(rows);
      },

      // 让 builder 可被 await（thenable），返回 {data, error} 与真实 Supabase 一致
      then(resolve) {
        this._execute().then(rows => resolve({ data: rows, error: null }));
      }
    };
    return b;
  };

  return self;
}

function showToast(msg, type = '') {
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ========================================================
   1. 班级加载
   ======================================================== */
async function loadClasses() {
  try {
    const { data, error } = await mySupabase.from('classes').select('id, name').order('name', { ascending: true });
    if (error) throw error;

    if (!data || data.length === 0) {
      renderClasses([
        { id: 'default-1', name: '网安1班' },
        { id: 'default-2', name: '刑侦2班' }
      ]);
      showToast('未读取到班级数据，使用默认值', 'error');
    } else {
      renderClasses(data);
    }
  } catch (e) {
    console.error('班级加载失败:', e);
    renderClasses([
      { id: 'default-1', name: '网安1班' },
      { id: 'default-2', name: '刑侦2班' }
    ]);
    showToast('班级加载失败，使用默认值', 'error');
  }
}

function renderClasses(list) {
  classSelect.innerHTML = '';
  list.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    classSelect.appendChild(opt);
  });
  if (list.length) {
    currentClassId = list[0].id;
    loadRanking();
  }
}

  currentClassId = classSelect.value;

      .select('name, uniform_id, class_id, classes(name)')
      .eq('uniform_id', uniformId)
      .maybeSingle();
    if (error) throw error;

    if (!data) {
      studentInfo.classList.add('show');
      studentName.innerHTML = '<span class="notfound">查无此人</span>';
      studentTotal.textContent = '';
      currentStudent = null;
      loadStudentTotal(uniformId);
      return;
    }

    currentStudent = {
      uniform_id: data.uniform_id,
      name: data.name,
      class_name: data.classes?.name || '未知班级',
      class_id: data.class_id
    };
    studentInfo.classList.add('show');
    studentName.textContent = `${currentStudent.class_name} - ${currentStudent.name}`;
    loadStudentTotal(uniformId);
  } catch (e) {
    console.error('学生查询失败:', e);
    studentInfo.classList.add('show');
    studentName.innerHTML = '<span class="notfound">查询出错</span>';
    studentTotal.textContent = '';
    currentStudent = null;
  }
}

async function loadStudentTotal(uniformId) {
  try {
    const { data, error } = await mySupabase
      .from('scores')
      .select('score_added')
      .eq('student_uniform_id', uniformId);
    if (error) throw error;
    const total = (data || []).reduce((s, r) => s + Number(r.score_added || 0), 0);
    studentTotal.innerHTML = `当前总积分：<b>${total}</b> 分`;
  } catch (e) {
    console.error('积分加载失败:', e);
    studentTotal.textContent = '积分加载失败';
  }
}

/* ========================================================
   加分按钮
   ======================================================== */
document.querySelectorAll('.score-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const uniformId = uniformInput.value.trim();
    if (!uniformId) {
      showToast('请先输入制服编号', 'error');
      uniformInput.focus();
      return;
    }
    const score = parseInt(btn.dataset.score, 10);
    const comment = commentInput.value.trim();
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = '提交中...';
    try {
      const { error } = await mySupabase.from('scores').insert({
        student_uniform_id: uniformId,
        score_added: score,
        comment: comment || null
      });
      if (error) throw error;
      showToast(`+${score} 分 已记录`, 'success');
      commentInput.value = '';
      await Promise.all([loadStudentTotal(uniformId), loadRanking()]);
    } catch (e) {
      console.error('加分失败:', e);
      showToast('加分失败：' + (e.message || '未知错误'), 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });
});

/* ========================================================
   3. 班级排行榜
   ======================================================== */
async function loadRanking() {
  if (!currentClassId) return;
  rankingContainer.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const { data: students, error: e1 } = await mySupabase
      .from('students')
      .select('id, name, uniform_id')
      .eq('class_id', currentClassId);
    if (e1) throw e1;

    if (!students || students.length === 0) {
      rankingContainer.innerHTML = '<div class="empty">该班级暂无学生数据</div>';
      currentRanking = [];
      return;
    }

    const uniformIds = students.map(s => s.uniform_id);

    const { data: scores, error: e2 } = await mySupabase
      .from('scores')
      .select('student_uniform_id, score_added')
      .in('student_uniform_id', uniformIds);
    if (e2) throw e2;

    const scoreMap = {};
    (scores || []).forEach(r => {
      const uid = r.student_uniform_id;
      scoreMap[uid] = (scoreMap[uid] || 0) + Number(r.score_added || 0);
    });

    const ranking = students.map(s => ({
      name: s.name,
      uniform_id: s.uniform_id,
      total: scoreMap[s.uniform_id] || 0
    })).sort((a, b) => b.total - a.total);

    currentRanking = ranking;
    renderRanking(ranking);
  } catch (e) {
    console.error('排行榜加载失败:', e);
    rankingContainer.innerHTML = '<div class="empty">排行榜加载失败</div>';
    currentRanking = [];
  }
}

function renderRanking(list) {
  if (!list.length) {
    rankingContainer.innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  let html = `<table>
    <thead><tr>
      <th style="width:60px">排名</th>
      <th>姓名</th>
      <th>制服编号</th>
      <th style="text-align:right">总积分</th>
    </tr></thead><tbody>`;
  list.forEach((s, i) => {
    const rank = i + 1;
    const rankClass = rank <= 3 ? `rank-${rank}` : '';
    html += `<tr>
      <td><span class="rank-badge ${rankClass}">${rank}</span></td>
      <td>${escapeHtml(s.name)}</td>
      <td>${escapeHtml(s.uniform_id)}</td>
      <td style="text-align:right"><b style="color:var(--accent);font-size:16px">${s.total}</b></td>
    </tr>`;
  });
  html += '</tbody></table>';
  rankingContainer.innerHTML = html;
}

/* ========================================================
   导出 CSV
   ======================================================== */
exportBtn.addEventListener('click', () => {
  const list = currentRanking || [];
  if (!list.length) {
    showToast('暂无数据可导出', 'error');
    return;
  }
  const className = classSelect.options[classSelect.selectedIndex]?.textContent || '班级';
  const header = ['排名', '姓名', '制服编号', '总积分'];
  const rows = list.map((s, i) => [i + 1, s.name, s.uniform_id, s.total]);
  const csv = [header, ...rows]
    .map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(','))
    .join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const ts = new Date().toISOString().slice(0, 10);
  a.download = `${className}_积分排行榜_${ts}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出 CSV', 'success');
});

/* ========================================================
   清空模拟数据（仅模拟模式可用）
   ======================================================== */
clearBtn.addEventListener('click', () => {
  if (!USE_MOCK) return;
  if (!confirm('确定要清空所有模拟数据并重置吗？')) return;
  localStorage.removeItem(MOCK_DB_KEY);
  showToast('模拟数据已重置', 'success');
  location.reload();
});

/* ========================================================
   启动
   ======================================================== */
initSupabase().then(() => {
  loadClasses();
}).catch(e => {
  console.error('启动失败:', e);
  showToast('启动失败', 'error');
});
</script>
